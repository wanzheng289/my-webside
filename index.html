    <script>
        /* ==========================================
           AUDIO SYNTHESIZER (8-BIT MINECRAFT SOUNDS)
           ========================================== */
        class RetroAudio {
            constructor() {
                this.ctx = null;
                this.bgmPlaying = false;
                this.bgmInterval = null;
                this.noteIdx = 0;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playClick() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playChestOpen() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(320, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.25);
            }

            playNote(freq, duration = 0.15) {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + duration);
            }

            toggleBGM(callback) {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                this.bgmPlaying = !this.bgmPlaying;

                if (this.bgmPlaying) {
                    // C-major Minecraft style peaceful loop
                    const notes = [
                        261.63, 329.63, 392.00, 523.25, 392.00, 329.63,
                        293.66, 349.23, 440.00, 587.33, 440.00, 349.23,
                        220.00, 261.63, 329.63, 440.00, 329.63, 261.63,
                        196.00, 246.94, 293.66, 392.00, 293.66, 246.94
                    ];
                    this.bgmInterval = setInterval(() => {
                        this.playNote(notes[this.noteIdx], 0.4);
                        this.noteIdx = (this.noteIdx + 1) % notes.length;
                    }, 400);
                } else {
                    clearInterval(this.bgmInterval);
                }
                if (callback) callback(this.bgmPlaying);
            }
        }

        const audio = new RetroAudio();
    </script>

    <script>
        /* ==========================================
           PROCEDURAL 16x16 MINECRAFT TEXTURE GENERATOR
           ========================================== */
        function createPixelTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');

            function fillPixel(x, y, color) {
                ctx.fillStyle = color;
                ctx.fillRect(x, y, 1, 1);
            }

            // Fill canvas helper
            function fillBase(color) {
                ctx.fillStyle = color;
                ctx.fillRect(0, 0, 16, 16);
            }

            // Add random noise for block texture feel
            function addNoise(factor = 10) {
                const imgData = ctx.getImageData(0, 0, 16, 16);
                const d = imgData.data;
                for (let i = 0; i < d.length; i += 4) {
                    const noise = (Math.random() - 0.5) * factor;
                    d[i] = Math.min(255, Math.max(0, d[i] + noise));
                    d[i+1] = Math.min(255, Math.max(0, d[i+1] + noise));
                    d[i+2] = Math.min(255, Math.max(0, d[i+2] + noise));
                }
                ctx.putImageData(imgData, 0, 0);
            }

            if (type === 'oak_planks') {
                fillBase('#a07142');
                ctx.fillStyle = '#6b4522';
                for (let y = 0; y < 16; y += 4) {
                    ctx.fillRect(0, y, 16, 1);
                }
                addNoise(15);
            } else if (type === 'oak_log_side') {
                fillBase('#5c4326');
                ctx.fillStyle = '#3a2712';
                for (let x = 0; x < 16; x += 3) {
                    ctx.fillRect(x, 0, 1, 16);
                }
                addNoise(12);
            } else if (type === 'oak_log_top') {
                fillBase('#9d7c4d');
                ctx.strokeStyle = '#624929';
                ctx.strokeRect(2, 2, 12, 12);
                ctx.strokeRect(5, 5, 6, 6);
                addNoise(10);
            } else if (type === 'bookshelf') {
                fillBase('#a07142');
                // Shelf planks
                ctx.fillStyle = '#513217';
                ctx.fillRect(0, 0, 16, 2);
                ctx.fillRect(0, 7, 16, 2);
                ctx.fillRect(0, 14, 16, 2);
                // Books
                const colors = ['#a82e2e', '#2e6da8', '#2ea84b', '#a8a22e', '#802ea8', '#d67520'];
                for (let x = 1; x < 15; x += 2) {
                    ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                    ctx.fillRect(x, 2, 1, 5);
                    ctx.fillRect(x, 9, 1, 5);
                }
            } else if (type === 'crafting_table_top') {
                fillBase('#a07142');
                ctx.fillStyle = '#36210d';
                ctx.strokeRect(1, 1, 14, 14);
                // Grid lines
                ctx.fillRect(5, 1, 1, 14);
                ctx.fillRect(10, 1, 1, 14);
                ctx.fillRect(1, 5, 14, 1);
                ctx.fillRect(1, 10, 14, 1);
                addNoise(10);
            } else if (type === 'jukebox_top') {
                fillBase('#523720');
                ctx.fillStyle = '#111111';
                ctx.fillRect(5, 5, 6, 6);
                ctx.fillStyle = '#4ae3e3'; // Diamond center inlay
                ctx.fillRect(7, 7, 2, 2);
            } else if (type === 'painting_pvz') {
                // Purple Mushroom PVZ art tribute from image
                fillBase('#211a2e');
                ctx.fillStyle = '#8338ec'; // Mushroom head
                ctx.beginPath();
                ctx.arc(8, 7, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ff007f'; // Spots
                ctx.fillRect(6, 4, 2, 2);
                ctx.fillRect(9, 7, 2, 2);
                ctx.fillStyle = '#e2afff'; // Stem
                ctx.fillRect(6, 10, 4, 4);
                ctx.fillStyle = '#000000'; // Eyes
                ctx.fillRect(7, 11, 1, 1);
                ctx.fillRect(8, 11, 1, 1);
            } else if (type === 'screen_code') {
                fillBase('#181a1f');
                ctx.fillStyle = '#61afef';
                ctx.fillRect(2, 2, 6, 1);
                ctx.fillStyle = '#98c379';
                ctx.fillRect(9, 2, 5, 1);
                ctx.fillStyle = '#e5c07b';
                ctx.fillRect(3, 5, 8, 1);
                ctx.fillRect(3, 8, 10, 1);
                ctx.fillStyle = '#c678dd';
                ctx.fillRect(2, 11, 4, 1);
                ctx.fillStyle = '#abb2bf';
                ctx.fillRect(7, 11, 7, 1);
            } else if (type === 'wool_rug') {
                fillBase('#9d3232');
                ctx.strokeStyle = '#c94d4d';
                ctx.strokeRect(1, 1, 14, 14);
                addNoise(15);
            } else if (type === 'stone_bricks') {
                fillBase('#737373');
                ctx.fillStyle = '#3a3a3a';
                ctx.fillRect(0, 4, 16, 1);
                ctx.fillRect(0, 9, 16, 1);
                ctx.fillRect(0, 14, 16, 1);
                ctx.fillRect(8, 0, 1, 4);
                ctx.fillRect(4, 5, 1, 4);
                ctx.fillRect(12, 5, 1, 4);
                ctx.fillRect(8, 10, 1, 4);
                addNoise(15);
            } else if (type === 'chest_front') {
                fillBase('#a07142');
                ctx.fillStyle = '#2b1b0e';
                ctx.strokeRect(0, 0, 16, 16);
                ctx.fillRect(0, 6, 16, 2); // Split line
                ctx.fillStyle = '#d4af37'; // Lock
                ctx.fillRect(7, 5, 2, 3);
                ctx.fillStyle = '#000';
                ctx.fillRect(7.5, 6, 1, 1);
            } else {
                fillBase('#888888');
                addNoise(20);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        // Pre-create textures map
        const textures = {
            oak: createPixelTexture('oak_planks'),
            logSide: createPixelTexture('oak_log_side'),
            logTop: createPixelTexture('oak_log_top'),
            bookshelf: createPixelTexture('bookshelf'),
            craftingTop: createPixelTexture('crafting_table_top'),
            jukeboxTop: createPixelTexture('jukebox_top'),
            paintingPvz: createPixelTexture('painting_pvz'),
            screenCode: createPixelTexture('screen_code'),
            rug: createPixelTexture('wool_rug'),
            stoneBricks: createPixelTexture('stone_bricks'),
            chestFront: createPixelTexture('chest_front')
        };
    </script>

    <script>
        /* ==========================================
           3D SCENE & INTERACTIVE ROOM INITIALIZATION
           ========================================== */
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#0d1117');

        // Camera setup (Isometric perspective)
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        const defaultCamPos = new THREE.Vector3(14, 12, 14);
        camera.position.copy(defaultCamPos);

        // Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);

            slot.innerHTML = `
                <i data-lucide="${data.icon || 'box'}" class="w-6 h-6 text-yellow-300"></i>
                <span class="absolute bottom-0.5 right-1 text-[9px] text-gray-400 font-bold">${idx + 1}</span>
            `;
            slot.addEventListener('click', () => {
                audio.playClick();
                focusAndOpenObject(obj);
            });
            hotbarContainer.appendChild(slot);
        });

        // Initialize Lucide Icons
        lucide.createIcons();

        // Mouse move raycasting
        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects, true);

            if (intersects.length > 0) {
                // Find top interactive object
                let hit = intersects[0].object;
                while (hit.parent && !hit.userData.interactive && hit.parent !== scene) {
                    hit = hit.parent;
                }

                if (hit && hit.userData.interactive) {
                    if (hoveredObject !== hit) {
                        if (hoveredObject) resetHover(hoveredObject);
                        hoveredObject = hit;
                        setHover(hoveredObject);
                    }

                    // Position tooltip near cursor
                    tooltip.classList.remove('hidden');
                    tooltip.style.left = `${event.clientX + 15}px`;
                    tooltip.style.top = `${event.clientY + 15}px`;
                    tooltipTitle.textContent = hit.userData.name;
                    tooltipDesc.textContent = hit.userData.desc;
                    document.body.style.cursor = 'pointer';
                    return;
                }
            }

            if (hoveredObject) {
                resetHover(hoveredObject);
                hoveredObject = null;
            }
            tooltip.classList.add('hidden');
            document.body.style.cursor = 'default';
        });

        function setHover(obj) {
            obj.scale.set(
                obj.userData.originalScale.x * 1.08,
                obj.userData.originalScale.y * 1.08,
                obj.userData.originalScale.z * 1.08
            );
        }

        function resetHover(obj) {
            if (obj && obj.userData.originalScale) {
                obj.scale.copy(obj.userData.originalScale);
            }
        }

        // On Click Interaction
        window.addEventListener('click', (e) => {
            // Ignore UI clicks
            if (e.target.closest('#mc-modal') || e.target.closest('.pointer-events-auto')) return;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects, true);

            if (intersects.length > 0) {
                let hit = intersects[0].object;
                while (hit.parent && !hit.userData.interactive && hit.parent !== scene) {
                    hit = hit.parent;
                }
                if (hit && hit.userData.interactive) {
                    audio.playClick();
                    focusAndOpenObject(hit);
                }
            }
        });

        // Focus camera & open GUI modal
        function focusAndOpenObject(obj) {
            const targetPos = new THREE.Vector3();
            obj.getWorldPosition(targetPos);

            // Animate camera target towards object smoothly
            const startTarget = controls.target.clone();
            const endTarget = new THREE.Vector3(targetPos.x, targetPos.y + 0.5, targetPos.z);
            let startTime = performance.now();

            function animateCam() {
                const elapsed = (performance.now() - startTime) / 300;
                if (elapsed < 1) {
                    controls.target.lerpVectors(startTarget, endTarget, elapsed);
                    requestAnimationFrame(animateCam);
                } else {
                    controls.target.copy(endTarget);
                }
            }
            animateCam();

            // Open Modal UI
            openModal(obj.userData);
        }
    </script>

    <script>
        /* ==========================================
           MINECRAFT MODAL GUI SYSTEM
           ========================================== */
        const modal = document.getElementById('mc-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const modalIconBox = document.getElementById('modal-icon-box');

        function openModal(data) {
            modalTitle.textContent = data.modalData.title || data.name;
            modalIconBox.innerHTML = `<i data-lucide="${data.icon || 'box'}" class="w-6 h-6"></i>`;
            lucide.createIcons();

            let html = '';

            if (data.modalData.type === 'about') {
                html = data.modalData.content;
                if (data.modalData.articleUrl) {
                    html += `<a class="mc-button mc-article-link px-4 py-2 text-xs no-underline" href="${data.modalData.articleUrl}">${data.modalData.articleLabel || '阅读对应文章'}</a>`;
                }
            } else if (data.modalData.type === 'projects') {
                html = `<p class="mb-3 text-gray-300">${data.modalData.intro}</p>`;
                html += `<div class="space-y-3">`;
                data.modalData.items.forEach(proj => {
                    html += `
                        <div class="mc-border p-3 bg-gray-900/90 hover:border-yellow-400 transition">
                            <div class="font-bold text-yellow-300 text-sm mb-1">${proj.name}</div>
                            ${proj.meta ? `<div class="text-[10px] text-gray-500 mb-2">${proj.meta}</div>` : ''}
                            <div class="text-xs text-gray-300 mb-2">${proj.desc}</div>
                            ${proj.detail ? `<ul class="list-disc pl-4 text-[11px] text-gray-400 mb-2 space-y-1">${proj.detail.map(point => `<li>${point}</li>`).join('')}</ul>` : ''}
                            <div class="flex gap-1.5 flex-wrap">
                                ${proj.tags.map(t => `<span class="mc-chip">${t}</span>`).join('')}
                            </div>
                            ${proj.url ? `<a class="mc-button mc-article-link px-4 py-2 text-xs no-underline" href="${proj.url}">阅读对应文章</a>` : ''}
                            ${proj.secondaryUrl ? `<a class="mc-button mc-article-link px-4 py-2 text-xs no-underline" href="${proj.secondaryUrl}">${proj.secondaryLabel || '阅读更多'}</a>` : ''}
                        </div>
                    `;
                });
                html += `</div>`;
            } else if (data.modalData.type === 'list') {
                html = `<p class="mb-3 text-gray-300">${data.modalData.intro}</p>`;
                html += `<div class="grid gap-2">`;
                data.modalData.items.forEach(item => {
                    html += `
                        <div class="p-2.5 mc-dark-container border border-gray-700 flex flex-col">
                            <span class="font-bold text-yellow-300">${item.title}</span>
                            <span class="text-xs text-gray-400 mt-1">${item.desc}</span>
                            ${item.tags ? `<span class="flex gap-1.5 flex-wrap mt-2">${item.tags.map(t => `<span class="mc-chip">${t}</span>`).join('')}</span>` : ''}
                            ${item.url ? `<a class="mc-button mc-article-link px-4 py-2 text-xs no-underline" href="${item.url}">阅读对应文章</a>` : ''}
                        </div>
                    `;
                });
                html += `</div>`;
            } else if (data.modalData.type === 'socials') {
                audio.playChestOpen();
                html = `<p class="mb-3 text-gray-300">${data.modalData.intro}</p>`;
                html += `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">`;
                data.modalData.links.forEach(link => {
                    html += `
                        <a href="${link.url}" ${link.url === '#' ? 'aria-disabled="true"' : 'target="_blank"'} class="p-3 mc-button flex items-center gap-3 rounded text-left no-underline group">
                            <div class="w-8 h-8 ${link.color} rounded flex items-center justify-center text-white">
                                <i data-lucide="${link.icon}" class="w-4 h-4"></i>
                            </div>
                            <div>
                                <div class="font-bold text-yellow-300 text-xs">${link.name}</div>
                                <div class="text-[10px] text-gray-300">${link.handle}</div>
                            </div>
                        </a>
                    `;
                });
                html += `</div>`;
            } else if (data.modalData.type === 'music') {
                html = `
                    <div class="text-center py-4 space-y-4">
                        <div class="text-yellow-300 font-bold">Minecraft 8-Bit 像素风唱片 11</div>
                        <p class="text-xs text-gray-300">点击下方按钮播放或暂停 Web Audio 实时合成的 8-Bit 像素背景音乐！</p>
                        <button id="modal-bgm-btn" class="mc-button px-6 py-3 text-xs text-yellow-300 inline-flex items-center gap-2">
                            <i data-lucide="disc" class="w-4 h-4 animate-spin"></i>
                            开关 8-Bit 背景音乐
                        </button>
                    </div>
                `;
            } else if (data.modalData.actionType === 'toggle_lamp') {
                toggleLamp();
                html = `<div class="p-4 text-center text-yellow-300">💡 已切换红石台灯！</div>`;
            }

            modalBody.innerHTML = html;
            lucide.createIcons();

            // Handle special inner button handlers
            const modalBgmBtn = document.getElementById('modal-bgm-btn');
            if (modalBgmBtn) {
                modalBgmBtn.addEventListener('click', () => {
                    audio.toggleBGM((playing) => {
                        document.getElementById('bgm-text').textContent = playing ? '音乐: 开' : '音乐: 关';
                    });
                });
            }

            modal.classList.remove('hidden');
        }

        // Close Modal
        function closeModal() {
            audio.playClick();
            modal.classList.add('hidden');
        }

        document.getElementById('modal-close').addEventListener('click', closeModal);
        document.getElementById('modal-ok-btn').addEventListener('click', closeModal);

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            // Hotbar number keys 1-9
            if (e.key >= '1' && e.key <= '9') {
                const idx = parseInt(e.key) - 1;
                if (interactiveObjects[idx]) {
                    audio.playClick();
                    focusAndOpenObject(interactiveObjects[idx]);
                }
            }
        });

        // --- Lamp Switch Logic ---
        let lampOn = true;
        function toggleLamp() {
            lampOn = !lampOn;
            deskLampLight.intensity = lampOn ? 1.2 : 0;
            audio.playClick();
        }

        // --- BGM Toggle Button ---
        document.getElementById('bgm-toggle').addEventListener('click', () => {
            audio.toggleBGM((playing) => {
                document.getElementById('bgm-text').textContent = playing ? '音乐: 开' : '音乐: 关';
            });
        });

        // --- Day / Night Cycle Switcher ---
        let isNight = false;
        document.getElementById('daynight-toggle').addEventListener('click', () => {
            audio.playClick();
            isNight = !isNight;
            if (isNight) {
                scene.background = new THREE.Color('#05070a');
                ambientLight.intensity = 0.2;
                dirLight.intensity = 0.2;
                document.getElementById('daynight-text').textContent = '夜晚';
            } else {
                scene.background = new THREE.Color('#0d1117');
                ambientLight.intensity = 0.65;
                dirLight.intensity = 0.8;
                document.getElementById('daynight-text').textContent = '白天';
            }
        });

        // --- Reset Camera View ---
        document.getElementById('reset-cam-btn').addEventListener('click', () => {
            audio.playClick();
            camera.position.copy(defaultCamPos);
            controls.target.set(0, 2, 0);
        });

        // --- Window Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Main Render Loop ---
        function animate() {
            requestAnimationFrame(animate);

            // Subtle floating idle animation for interactive objects
            const time = Date.now() * 0.002;
            interactiveObjects.forEach((obj, idx) => {
                if (obj.userData.category === 'art') {
                    obj.rotation.y = Math.sin(time + idx) * 0.03;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = function() {
            animate();
        };
    </script>
